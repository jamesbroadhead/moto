name: Box upstream sync

# Merges getmoto/moto master into box-fixes every week. A clean merge whose touched tests pass is pushed; anything
# else becomes an `upstream-sync` issue for an agent to resolve (AGENTS.md, "Syncing with upstream").
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: box-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jamesbroadhead/moto'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: box-fixes
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getmoto/moto.git
          git fetch --quiet upstream master
          base=$(git merge-base HEAD upstream/master)
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = 0 ]; then exit 0; fi
          # Services upstream changed: only their tests can break by merging.
          git diff --name-only "$base" upstream/master \
            | sed -nE 's#^(moto/([a-z0-9_]+)/|tests/test_([a-z0-9_]+)/).*#\2\3#p' | sort -u > services.txt
          echo "services=$(tr '\n' ' ' < services.txt)" >> "$GITHUB_OUTPUT"
          # GITHUB_TOKEN cannot push changes to workflow files, so those merges go to an agent.
          if git diff --name-only HEAD...upstream/master | grep -q '^.github/workflows/'; then
            echo "conflicts=.github/workflows (upstream changed workflows; the bot token cannot push them)" >> "$GITHUB_OUTPUT"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge upstream master into box-fixes" upstream/master; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.merge.outputs.result == 'merged'
        with:
          python-version: "3.12"

      - name: Test the services upstream changed
        id: test
        if: steps.merge.outputs.result == 'merged'
        run: |
          pip install --quiet -r requirements-dev.txt pytest-xdist
          dirs=""
          for s in ${{ steps.merge.outputs.services }}; do
            [ -d "tests/test_$s" ] && dirs="$dirs tests/test_$s"
          done
          if [ -n "$dirs" ]; then
            pytest -q -n 4 -p no:cacheprovider $dirs 2>&1 | tail -40 | tee pytest-tail.txt
            exit "${PIPESTATUS[0]}"
          fi

      - name: Push
        if: steps.merge.outputs.result == 'merged' && steps.test.outcome == 'success'
        run: git push origin HEAD:box-fixes

      - name: Open an issue for an agent
        if: always() && steps.merge.outputs.behind != '0' && (steps.merge.outputs.result == 'conflict' || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.merge.outputs.result }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          SERVICES: ${{ steps.merge.outputs.services }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create upstream-sync --color FBCA04 --description "box-fixes needs a manual upstream merge" 2>/dev/null || true
          if [ "$RESULT" = conflict ]; then
            what="Merging upstream master into box-fixes conflicts in: \`$CONFLICTS\`"
          else
            what="Upstream master merges cleanly, but tests fail for: \`$SERVICES\`"$'\n\n```\n'"$(cat pytest-tail.txt)"$'\n```'
          fi
          body="$what"$'\n\n'"Run: $RUN_URL"$'\n\n'"Resolve it as AGENTS.md, \"Syncing with upstream\", describes."
          existing=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "box-fixes: upstream sync needs an agent" --label upstream-sync --body "$body"
          fi
